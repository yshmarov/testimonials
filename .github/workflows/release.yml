# Publishes the gem to RubyGems when a v* tag is pushed, via RubyGems
# trusted publishing (OIDC) — no API key, no OTP prompt.
#
# One-time setup on rubygems.org (gem owner):
#   Gem page → Ownership → Trusted publishers → GitHub Actions →
#   repository: yshmarov/testimonials, workflow: release.yml
#
# Release flow after that:
#   git tag v0.x.y && git push origin v0.x.y
#
# We configure the OIDC credentials and then build + push directly, rather than
# using rubygems/release-gem (which can publish successfully and then fail while
# running the surrounding release task).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Run tests before publishing
        run: bundle exec rake test
      - name: Verify tag matches gem version
        run: |
          version="$(ruby -Ilib -r testimonials/version -e 'print Testimonials::VERSION')"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Check whether this version is already published
        id: release
        env:
          GEM_NAME: testimonials
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ruby -rjson -rnet/http -ruri -e '
            name, version = ARGV
            uri = URI("https://rubygems.org/api/v1/versions/#{name}.json")
            versions = JSON.parse(Net::HTTP.get(uri))
            exit(versions.any? { |item| item.fetch("number") == version } ? 0 : 1)
          ' "$GEM_NAME" "$version"
          then
            echo "$GEM_NAME $version is already published; nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
        if: steps.release.outputs.needed == 'true'
      - name: Build and push the gem
        if: steps.release.outputs.needed == 'true'
        run: |
          gem build testimonials.gemspec
          gem push testimonials-*.gem
